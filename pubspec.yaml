name: spider_panel
description: Spider Panel - VPN Management App
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  provider: ^6.1.1
  flutter_secure_storage: ^9.0.0
  qr_flutter: ^4.1.0
  url_launcher: ^6.2.2
  flutter_animate: ^4.5.0
  glassmorphism: ^3.0.0
  intl: ^0.19.0
