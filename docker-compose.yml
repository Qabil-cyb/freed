version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: spider
      POSTGRES_PASSWORD: spider
      POSTGRES_DB: spider_panel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://spider:spider@db:5432/spider_panel
      REDIS_URL: redis://redis:6379
      JWT_SECRET_KEY: dev-secret-change-in-production
      FIRST_API_KEY: spider-panel-dev-key
    depends_on:
      - db
      - redis

volumes:
  pgdata:
